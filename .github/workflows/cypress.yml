name: Testes Cypress

on:
  workflow_dispatch:

  schedule:
    - cron: '0 21 * * *'
      timezone: 'America/Sao_Paulo'

jobs:
  testes-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cypress-pipeline-agendado

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cypress-pipeline-agendado/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes Cypress
        run: npm test

      - name: Salvar evidencias em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-cypress
          path: |
            cypress-pipeline-agendado/cypress/screenshots
            cypress-pipeline-agendado/cypress/videos
          if-no-files-found: ignore